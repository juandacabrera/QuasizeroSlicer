name: Quasizero Build

# Fork-specific workflow for the Quasizero Slicer MVP branch.
# Reuses OrcaSlicer's upstream build chain (build_check_cache -> build_deps ->
# build_orca), which produces the Windows x64 portable zip and NSIS installer.

on:
  push:
    branches:
      - quasizero-slicer-mvp
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: quasizero-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qz_core_tests:
    name: QZmini core tests (standalone)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            src/libslic3r/QuasiZero
            tests/qzmini
      - name: Build and run QuasiZero standalone tests
        run: |
          if [ -f tests/qzmini/standalone/run_standalone.sh ]; then
            bash tests/qzmini/standalone/run_standalone.sh
          else
            echo "standalone tests not present yet"; exit 1
          fi

  # Fast-fail gate: COMPILE ONLY on Linux (GCC, faster toolchain, cached deps).
  # Catches the same C++ errors as the Windows build in a fraction of the time.
  # Deliberately does NOT build the AppImage (-i) or package anything — Linux is
  # not a delivery target here, and AppImage packaging depends on Linux-only
  # icon/desktop assets that are irrelevant to catching compile errors.
  linux_compile_gate:
    name: Linux compile gate (fast fail)
    needs: qz_core_tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'false'
      - name: Dependency cache (restore + save; self-healing when GitHub evicts it)
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/deps/build/OrcaSlicer_dep
          key: linux-clang-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}
      - name: Apt-Install Dependencies
        uses: ./.github/actions/apt-install-deps
      - name: Compile slicer (no AppImage, no packaging)
        shell: bash
        run: |
          # -d ensures deps exist: with a restored cache it is a quick stamp check;
          # on a cache miss (GitHub evicts caches beyond the 10 GB repo quota) it
          # rebuilds them and the cache step above saves them again.
          # -s build slicer, -r skip RAM/disk checks, -l Clang, -L lld. No -i (AppImage).
          ./build_linux.sh -dsrlL

  build_windows_x64:
    name: Build Windows x64 (portable + installer)
    needs: qz_core_tests   # run in PARALLEL with the Linux gate (fast fail signal), not after it
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
    secrets: inherit
